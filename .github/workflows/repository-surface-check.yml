name: Repository Surface Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-surface-check:
    name: Repository Surface Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Scan repository surface markers
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path(".").resolve()
          fragments = [
              ("co", "dex"),
              ("open", "ai"),
              ("chat", "gpt"),
              ("generated by ", "ai"),
              ("generated with ", "ai"),
              ("created by ", "ai"),
              ("created with ", "ai"),
              ("authored by ", "ai"),
              ("written by ", "ai"),
              ("ai", "-generated"),
              ("ai", " generated"),
              ("llm", "-generated"),
              ("llm", " generated"),
          ]
          patterns = [left + right for left, right in fragments]
          tracked = subprocess.check_output(
              ["git", "ls-files"],
              text=True,
              encoding="utf-8",
          ).splitlines()

          violations = []
          for rel in tracked:
              lowered_path = rel.lower()
              for pattern in patterns:
                  if pattern in lowered_path:
                      violations.append((rel, 0, pattern))

              path = root / rel
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  text = path.read_text(encoding="utf-8", errors="ignore")
              except OSError:
                  continue

              for line_number, line in enumerate(text.splitlines(), start=1):
                  lowered_line = line.lower()
                  for pattern in patterns:
                      if pattern in lowered_line:
                          violations.append((rel, line_number, pattern))

          if violations:
              print("Prohibited repository surface markers found:")
              for rel, line_number, pattern in violations:
                  location = rel if line_number == 0 else f"{rel}:{line_number}"
                  print(f"- {location}: {pattern}")
              sys.exit(1)

          print("No prohibited repository surface markers found.")
          PY
